<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Árbol Interactivo con Recorridos</title>
    <script src="https://unpkg.com/vis-network/standalone/umd/vis-network.min.js"></script>
    <style>
        :root {
            --color1: #1f1f20;
            --color2: #2b4c7e;
            --color3: #567ebb;
            --color4: #606d80;
            --color5: #dce0e6;
            --texto: #333;
        }

        body {
            font-family: 'Times New Roman', Times, serif;
            text-align: center;
            background-color: var(--color5);
            color: var(--texto);
        }

        .container {
            display: flex;
            justify-content: space-around;
            flex-wrap: wrap;
        }

        .tree-container {
            width: 45%;
        }

        .buttons {
            margin: 20px;
            display: flex;
            justify-content: center;
            gap: 10px;
        }

        button {
            padding: 12px 18px;
            font-size: 16px;
            cursor: pointer;
            border: none;
            border-radius: 8px;
            color: white;
            transition: 0.3s;
        }

        .btn-preorden { background-color: var(--color1); }
        .btn-inorden { background-color: var(--color2); }
        .btn-postorden { background-color: var(--color3); }
        .btn-nivel { background-color: var(--color4); color: var(--texto); }

        button:hover { filter: brightness(0.9); }

        .grafo {
            width: 100%;
            height: 400px;
            border: 2px solid var(--color1);
            border-radius: 10px;
            background-color: var(--color5);
        }

        /* Estilos del popup */
        .popup-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            z-index: 5;
        }

        .popup {
            display: none;
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 500px;
            height: 500px;
            background: white;
            padding: 20px;
            border-radius: 10px;
            z-index: 10;
            text-align: center;
        }

        #popup-grafo {
            width: 100%;
            height: 400px;
            border: 2px solid var(--color1);
            border-radius: 10px;
            background-color: var(--color5);
        }
    </style>
</head>

<body>

    <h2>Sistema de Reconocimiento de Emociones</h2>
    
    <div class="container">
        <div class="tree-container">
            <h3>Árbol 1 - Clasificación de Emociones</h3>
            <div class="buttons">
                <button class="btn-preorden" onclick="mostrarRecorrido(1, 'preorden')">Preorden</button>
                <button class="btn-inorden" onclick="mostrarRecorrido(1, 'inorden')">Inorden</button>
                <button class="btn-postorden" onclick="mostrarRecorrido(1, 'postorden')">Postorden</button>
            </div>
            <div class="buttons">
                <button class="btn-nivel" onclick="cambiarNivel(1, -1)">⬆️</button>
                <button class="btn-nivel" onclick="cambiarNivel(1, 1)">⬇️</button>
            </div>
            <div id="grafo1" class="grafo"></div>
        </div>

        <div class="tree-container">
            <h3>Árbol 2 - Ejecución del Modelo</h3>
            <div class="buttons">
                <button class="btn-preorden" onclick="mostrarRecorrido(2, 'preorden')">Preorden</button>
                <button class="btn-inorden" onclick="mostrarRecorrido(2, 'inorden')">Inorden</button>
                <button class="btn-postorden" onclick="mostrarRecorrido(2, 'postorden')">Postorden</button>
            </div>
            <div class="buttons">
                <button class="btn-nivel" onclick="cambiarNivel(2, -1)">⬆️</button>
                <button class="btn-nivel" onclick="cambiarNivel(2, 1)">⬇️</button>
            </div>
            <div id="grafo2" class="grafo"></div>
        </div>
    </div>

    <!-- Popup para mostrar los recorridos -->
    <div class="popup-overlay" id="popup-overlay" onclick="cerrarPopup()"></div>
    <div class="popup" id="popup">
        <h3 id="popup-title"></h3>
        <div id="popup-grafo"></div>
        <button onclick="cerrarPopup()">Cerrar</button>
    </div>

    <script>
         const arboles = {
            1: {
                nodos: [
                    { id: 1, label: "Clasificación Emociones", level: 1 },
                    { id: 2, label: "Emociones Débiles", level: 2 },
                    { id: 3, label: "Emociones Fuertes", level: 2 },
                    { id: 4, label: "Sorpresa", level: 3 },
                    { id: 5, label: "Felicidad", level: 3 },
                    { id: 6, label: "Tristeza", level: 3 },
                    { id: 7, label: "Enojo", level: 3 }
                ],
                arcos: [
                    { from: 1, to: 2 },
                    { from: 1, to: 3 },
                    { from: 2, to: 4 },
                    { from: 2, to: 5 },
                    { from: 3, to: 6 },
                    { from: 3, to: 7 }
                ],
                nivelActual: 1
            },
            2: {
                nodos: [
                    { id: 1, label: "Ejecución del Modelo", level: 1 },
                    { id: 2, label: "CloudDevops", level: 2 },
                    { id: 3, label: "Entrenamiento", level: 2 },
                    { id: 4, label: "Dataset", level: 3 },
                    { id: 5, label: "Obtención de Resultados", level: 3 },
                    { id: 6, label: "Cloud", level: 3 },
                    { id: 7, label: "Ejecución del Modelo", level: 3 }
                ],
                arcos: [
                    { from: 1, to: 2 },
                    { from: 1, to: 3 },
                    { from: 2, to: 4 },
                    { from: 2, to: 5 },
                    { from: 3, to: 6 },
                    { from: 3, to: 7 }
                ],
                nivelActual: 1
            }
        };

        function inicializarArbol(id) {
            const container = document.getElementById(`grafo${id}`);
            const { nodos, arcos } = arboles[id];

            const data = {
                nodes: new vis.DataSet(nodos),
                edges: new vis.DataSet(arcos)
            };

            const options = { layout: { hierarchical: { direction: "UD" } }, physics: false };
            arboles[id].network = new vis.Network(container, data, options);
        }
        function cambiarNivel(arbolId, direccion) {
            const arbol = arboles[arbolId];
            const nuevoNivel = arbol.nivelActual + direccion;

            const nodosFiltrados = arbol.nodos.filter(nodo => nodo.level === nuevoNivel);
            const arcosFiltrados = arbol.arcos.filter(arco => 
                nodosFiltrados.some(n => n.id === arco.from) && 
                nodosFiltrados.some(n => n.id === arco.to)
            );

            if (nodosFiltrados.length > 0) {
                arbol.nivelActual = nuevoNivel;
                arbol.network.setData({
                    nodes: new vis.DataSet(nodosFiltrados),
                    edges: new vis.DataSet(arcosFiltrados)
                });
            }
        }

        function mostrarRecorrido(arbolId, tipo) {
            const recorridos = {
                1: {
                    preorden: ["Clasificación Emociones", "Emociones Débiles", "Sorpresa", "Felicidad", "Emociones Fuertes", "Tristeza", "Enojo"],
                    inorden: ["Sorpresa", "Emociones Débiles", "Felicidad", "Clasificación Emociones", "Tristeza", "Emociones Fuertes", "Enojo"],
                    postorden: ["Sorpresa", "Felicidad", "Emociones Débiles", "Tristeza", "Enojo", "Emociones Fuertes", "Clasificación Emociones"]
                },
                2: {
                    preorden: ["Ejecución del modelo", "CloudDevops", "Dataset", "Obtención de resultados", "Entrenamiento", "Cloud", "Ejecución del modelo"],
                    inorden: ["Dataset", "CloudDevops", "Obtención de resultados", "Ejecución del modelo", "Cloud", "Entrenamiento", "Ejecución del modelo"],
                    postorden: ["Dataset", "Obtención de resultados", "CloudDevops", "Cloud", "Ejecución del modelo", "Entrenamiento", "Ejecución del modelo"]
                }
            };

            const labels = recorridos[arbolId][tipo];

            const nodos = labels.map((label, index) => ({
                id: index + 1,
                label,
                level: index + 1
            }));

            const arcos = nodos.slice(1).map((nodo, index) => ({
                from: nodos[index].id,
                to: nodo.id
            }));

            document.getElementById("popup-title").innerText = `Recorrido ${tipo.toUpperCase()} Árbol ${arbolId}`;
            document.getElementById("popup-overlay").style.display = "block";
            document.getElementById("popup").style.display = "block";

            setTimeout(() => {
                new vis.Network(document.getElementById("popup-grafo"), {
                    nodes: new vis.DataSet(nodos),
                    edges: new vis.DataSet(arcos)
                }, { layout: { hierarchical: true } });
            }, 100);
        }

        function cerrarPopup() {
            document.getElementById("popup-overlay").style.display = "none";
            document.getElementById("popup").style.display = "none";
        }
        inicializarArbol(1);
        inicializarArbol(2);
    </script>
</body>
</html>
